name: Deployment
on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
env:
  MONGODB_CLUSTER_ADDRESS: gha-demo
  MONGODB_DB_NAME: mmm

jobs:
  test:
  #i can have test ev here 
    env:
      MONGODB_CLUSTER_ADDRESS: gha-demo
      MONGODB_USERNAME: ${{ secrets.MONGODB_USERNAME }}
      MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
      MONGODB_DB_NAME: mmm
      MONGO_DB_PORT: 8981
    environment: testing
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: npm-deps-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      #- name: Run server
      #  run: npm start & npx wait-on http://127.0.0.1:$MONGO_DB_PORT
      - name: Run tests
        run: npm test
      - name: Output username
        run: echo "MONGODB_USERNAME: ${{ env.MONGODB_USERNAME }}"
      - name: Output DB name
        run: echo "MONGODB_DB_NAME: ${{ env.MONGODB_DB_NAME }}"
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Output information
        run: |        
          echo "..."
